# Gate C ClamAV Cloud Run scanner - clamd configuration.
# Loopback-only: no TCP listener is reachable outside this container, and no
# port is published by the Cloud Run service for clamd. Cloud Run IAM in
# front of the Node HTTP boundary is the sole authentication boundary.
TCPSocket 3310
TCPAddr 127.0.0.1
LocalSocket /tmp/clamd.sock

DatabaseDirectory /var/lib/clamav

# Matches KAI_SPRINT2_MAX_FILE_SIZE_BYTES (25 MiB) with headroom for the
# zINSTREAM chunk framing.
StreamMaxLength 26214400
MaxFileSize 26214400
MaxScanSize 26214400

User clamav
Foreground yes
LogTime yes
LogClean no
LogSyslog no

# Never leaves a stream sitting in memory unbounded.
ReadTimeout 120
CommandReadTimeout 30
